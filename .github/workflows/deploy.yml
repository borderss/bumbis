name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          # GIF picker provider keys, forwarded into the deploy script (sudo
          # strips the environment, so they are passed explicitly).
          envs: GIPHY_API_KEY,KLIPY_API_KEY
          script: |
            sudo GIPHY_API_KEY="$GIPHY_API_KEY" KLIPY_API_KEY="$KLIPY_API_KEY" bash /var/www/bumbis/scripts/deploy.sh
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
